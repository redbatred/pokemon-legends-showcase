<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto session results QA</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#071b30;color:#e4faff}nav{display:flex;gap:8px;padding:8px;flex-wrap:wrap}nav button{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto;overflow:hidden}output{display:block;font:12px monospace;white-space:pre-wrap;padding:10px}</style></head><body><nav><button id="desktop">Desktop</button><button id="phone">Phone</button><button id="compact">Landscape</button><button id="manual">Manual results</button><button id="session">10-pack results</button><button id="hundred">100-pack results</button><button id="interlude">Win interlude</button><button id="play">Play 10 auto packs</button><button id="single">Play 1 auto pack</button><button id="normal">Play normal Open All</button><button id="individual">Play one by one</button><button id="group-backs">Hold group backs</button><button id="group-faces">Hold group faces</button><button id="group-resume">Resume group</button><button id="group-special">Special group showcase</button><button id="normal-five">Play 5 normal packs</button><button id="slow">Slow next pack</button><button id="release">Release pack</button><button id="controls">Open All control</button><button id="hold-next">Pause next group</button></nav><div id="host" class="canvas-host"></div><output id="report">Loading</output><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {newSave} from '/src/game/model.ts';import {AutoSpinSession} from '/src/game/autoSpin.ts';import {ResultWin} from '/src/game/ResultWin.ts';import {setSound} from '/src/game/audio.ts';
const host=document.querySelector('#host'),report=document.querySelector('#report');let game,save,trace=[],seen=new Set(),releasePack=null,maxWorldJump=0,lastWorld=null,reveals=[],prices=[],groups=[],holdGroupAt=null;
async function fresh(){if(game)game.destroy();host.replaceChildren();save={...newSave(),balance:10000000};trace=[];seen=new Set();maxWorldJump=0;lastWorld=null;releasePack=null;reveals=[];prices=[];groups=[];holdGroupAt=null;game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>(save=newSave())});game.settings=()=>{setSound(false);game.stage.updateOptions({reduced:game.reduced,turbo:game.turbo,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};await game.init();game.sound=false;game.settings();const reveal=game.stage.reveal.bind(game.stage),showPrice=game.stage.onSpecialWin;game.stage.reveal=async(...args)=>{const entry={pack:game.autoRun?.completed??0,index:game.index,value:args[0].value,started:performance.now(),back:false,turned:false};reveals.push(entry);await reveal(...args);entry.finished=performance.now();};game.stage.onSpecialWin=(...args)=>{prices.push({index:game.index,value:args[0].value,at:performance.now()});showPrice?.(...args);};}
function result(index){const pack=game.packs[index%game.packs.length],pool=game.catalogs[pack.id],cards=Array.from({length:11},(_,i)=>pool[(i+index*3)%pool.length]);return {id:'qa-pack-'+index,at:new Date().toISOString(),pack,cards,total:cards.reduce((s,c)=>s+c.value,0)};}
async function seed(count,interlude=false){await fresh();const results=Array.from({length:count},(_,i)=>result(i));save={...save,history:results.slice().reverse().slice(0,30),totalWon:results.reduce((s,r)=>s+r.total,0)};game.save=save;game.resultId=results.at(-1).id;game.phase='complete';game.stage.showResult();if(count>1){game.autoRun=new AutoSpinSession(count===3?10:count,'all');for(const r of results)game.autoRun.record(r);game.autoRun.stop();game.autoInterlude=interlude;}game.render();if(interlude)game.cancelAutoTimer();}
for(const [id,w,h] of [['desktop',1280,780],['phone',390,780],['compact',568,320]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};
document.querySelector('#manual').onclick=()=>seed(1);document.querySelector('#session').onclick=()=>seed(10);document.querySelector('#hundred').onclick=()=>seed(100);document.querySelector('#interlude').onclick=()=>seed(3,true);
async function play(count,turbo=true,mode='all'){await fresh();game.turbo=turbo;game.settings();game.configureAuto(count,mode);game.action('auto-start');}
document.querySelector('#slow').onclick=async()=>{await fresh();game.turbo=true;game.settings();let requests=0;const original=game.stage.setPack.bind(game.stage);game.stage.setPack=async(...args)=>{if(++requests===2)await new Promise(resolve=>releasePack=resolve);return original(...args);};game.configureAuto(10,'all');game.action('auto-start');};document.querySelector('#release').onclick=()=>{releasePack?.();releasePack=null;};document.querySelector('#play').onclick=()=>play(10);document.querySelector('#single').onclick=()=>play(1);document.querySelector('#normal').onclick=()=>play(1,false);document.querySelector('#individual').onclick=()=>play(1,false,'individual');for(const [id,time] of [['group-backs',.74],['group-faces',2]])document.querySelector('#'+id).onclick=async()=>{await play(1,false);holdGroupAt=time;};document.querySelector('#group-resume').onclick=()=>game.stage.timeline?.resume();document.querySelector('#group-special').onclick=async()=>{await play(1,false);holdGroupAt=2;let injected=false;const transact=game.persistence.transactSave;game.persistence.transactSave=async update=>{const result=await transact(update);if(result.active&&!injected){injected=true;const special=game.pool.filter(c=>/Illustration|Ultra|Double/.test(c.rarity));result.active.cards.splice(8,2,...special.slice(0,2));}return result;};};document.querySelector('#normal-five').onclick=()=>play(5,false);document.querySelector('#controls').onclick=async()=>{await fresh();game.turbo=false;game.settings();game.action('open');};document.querySelector('#hold-next').onclick=()=>holdGroupAt=2;
setInterval(()=>{if(!game?.view)return;const auto=game.autoRun,heroes=game.view.root.children.filter(c=>c instanceof ResultWin),key=auto?.id+':'+auto?.completed;if(game.autoInterlude&&!seen.has(key)){seen.add(key);trace.push({pack:auto.completed,value:game.save.history[0].total,at:performance.now()});}report.textContent=JSON.stringify({phase:game.phase,turbo:game.turbo,reveals,prices,groups,group:game.stage.packReveal?{time:game.stage.packReveal.time,cards:game.stage.packReveal.items.length,fronts:game.stage.packReveal.items.filter(i=>i.front).length}:null,modal:game.view.modalKind,interlude:game.autoInterlude,opened:game.view.autoPack?.id,history:game.save?.history.length,session:auto?{count:auto.completed,total:auto.total,totalWon:auto.totalWon,sum:auto.results.reduce((n,r)=>n+r.total,0),running:auto.running,retained:auto.results.length}:null,heroes:heroes.map(h=>({value:h.amount.state.value,target:h.amount.state.target,remaining:h.amount.state.remaining})),transition:game.view.autoCover?{width:game.view.autoCover.width,height:game.view.autoCover.height,x:game.view.autoCover.x,y:game.view.autoCover.y,alpha:game.view.autoCover.alpha,waiting:!!releasePack}:null,maxWorldJump,packTargets:[...host.querySelectorAll('[data-control^="auto-pack-"]')].map(b=>b.getAttribute('aria-label')),trace,size:[host.clientWidth,host.clientHeight],error:game.error},null,2);},200);
function trackFrame(){const board=game?.stage.packReveal;if(board){let entry=groups.find(g=>g.pack===(game.autoRun?.completed??0));if(!entry){entry={pack:game.autoRun?.completed??0,backs:false,fronts:false,mixed:false,prices:[]};groups.push(entry);}const front=board.items.filter(i=>i.front).length;if(front===0)entry.backs=true;if(front===board.items.length)entry.fronts=true;if(front>0&&front<board.items.length)entry.mixed=true;if(board.items.every(i=>!i.taken&&i.price.alpha===1))entry.prices=board.items.map(i=>i.label.text);if(holdGroupAt!==null){const t=holdGroupAt;holdGroupAt=null;game.stage.timeline.pause().time(t);}}const reveal=reveals.at(-1);for(const f of game?.view?.rewards.flights??[])if(reveal&&reveal.index===f.index&&f.transferAge===null){reveal.displayed=Math.round(f.label.state.value);reveal.countFinished=f.countFinished;}if(reveal&&!reveal.finished&&game?.stage.cardMesh){if(game.stage.cardMesh.texture===game.stage.back)reveal.back=true;if(Math.abs(game.stage.motion.flip)>.3)reveal.turned=true;}if(game?.phase==='tearing'&&game.autoRun?.completed>0){if(lastWorld!==null)maxWorldJump=Math.max(maxWorldJump,Math.abs(game.stage.world.y-lastWorld));lastWorld=game.stage.world.y;}else lastWorld=null;requestAnimationFrame(trackFrame);}requestAnimationFrame(trackFrame);await seed(10);
</script></body></html>
