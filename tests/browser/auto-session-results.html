<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto session results QA</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#071b30;color:#e4faff}nav{display:flex;gap:8px;padding:8px;flex-wrap:wrap}nav button{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto;overflow:hidden}output{display:block;font:12px monospace;white-space:pre-wrap;padding:10px}</style></head><body><nav><button id="desktop">Desktop</button><button id="phone">Phone</button><button id="compact">Landscape</button><button id="manual">Manual results</button><button id="session">10-pack results</button><button id="hundred">100-pack results</button><button id="interlude">Win interlude</button><button id="play">Play 10 auto packs</button><button id="single">Play 1 auto pack</button><button id="slow">Slow next pack</button><button id="release">Release pack</button><button id="controls">Open All control</button></nav><div id="host" class="canvas-host"></div><output id="report">Loading</output><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {newSave} from '/src/game/model.ts';import {AutoSpinSession} from '/src/game/autoSpin.ts';import {ResultWin} from '/src/game/ResultWin.ts';import {setSound} from '/src/game/audio.ts';
const host=document.querySelector('#host'),report=document.querySelector('#report');let game,save,trace=[],seen=new Set(),releasePack=null,maxWorldJump=0,lastWorld=null;
async function fresh(){if(game)game.destroy();host.replaceChildren();save={...newSave(),balance:10000000};trace=[];seen=new Set();maxWorldJump=0;lastWorld=null;releasePack=null;game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>(save=newSave())});game.settings=()=>{setSound(false);game.stage.updateOptions({reduced:game.reduced,turbo:game.turbo,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};await game.init();game.sound=false;game.settings();}
function result(index){const pack=game.packs[index%game.packs.length],pool=game.catalogs[pack.id],cards=Array.from({length:11},(_,i)=>pool[(i+index*3)%pool.length]);return {id:'qa-pack-'+index,at:new Date().toISOString(),pack,cards,total:cards.reduce((s,c)=>s+c.value,0)};}
async function seed(count,interlude=false){await fresh();const results=Array.from({length:count},(_,i)=>result(i));save={...save,history:results.slice().reverse().slice(0,30),totalWon:results.reduce((s,r)=>s+r.total,0)};game.save=save;game.resultId=results.at(-1).id;game.phase='complete';game.stage.showResult();if(count>1){game.autoRun=new AutoSpinSession(count===3?10:count,'all');for(const r of results)game.autoRun.record(r);game.autoRun.stop();game.autoInterlude=interlude;}game.render();if(interlude)game.cancelAutoTimer();}
for(const [id,w,h] of [['desktop',1280,780],['phone',390,780],['compact',568,320]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};
document.querySelector('#manual').onclick=()=>seed(1);document.querySelector('#session').onclick=()=>seed(10);document.querySelector('#hundred').onclick=()=>seed(100);document.querySelector('#interlude').onclick=()=>seed(3,true);
async function play(count){await fresh();game.turbo=true;game.settings();game.configureAuto(count,'all');game.action('auto-start');}
document.querySelector('#slow').onclick=async()=>{await fresh();game.turbo=true;game.settings();let requests=0;const original=game.stage.setPack.bind(game.stage);game.stage.setPack=async(...args)=>{if(++requests===2)await new Promise(resolve=>releasePack=resolve);return original(...args);};game.configureAuto(10,'all');game.action('auto-start');};document.querySelector('#release').onclick=()=>{releasePack?.();releasePack=null;};document.querySelector('#play').onclick=()=>play(10);document.querySelector('#single').onclick=()=>play(1);document.querySelector('#controls').onclick=async()=>{await fresh();game.action('open');};
setInterval(()=>{if(!game?.view)return;const auto=game.autoRun,heroes=game.view.root.children.filter(c=>c instanceof ResultWin),key=auto?.id+':'+auto?.completed;if(game.autoInterlude&&!seen.has(key)){seen.add(key);trace.push({pack:auto.completed,value:game.save.history[0].total,at:performance.now()});}report.textContent=JSON.stringify({phase:game.phase,modal:game.view.modalKind,interlude:game.autoInterlude,opened:game.view.autoPack?.id,history:game.save?.history.length,session:auto?{count:auto.completed,total:auto.total,totalWon:auto.totalWon,sum:auto.results.reduce((n,r)=>n+r.total,0),running:auto.running,retained:auto.results.length}:null,heroes:heroes.map(h=>({value:h.amount.state.value,target:h.amount.state.target,remaining:h.amount.state.remaining})),transition:game.view.autoCover?{width:game.view.autoCover.width,height:game.view.autoCover.height,x:game.view.autoCover.x,y:game.view.autoCover.y,alpha:game.view.autoCover.alpha,waiting:!!releasePack}:null,maxWorldJump,packTargets:[...host.querySelectorAll('[data-control^="auto-pack-"]')].map(b=>b.getAttribute('aria-label')),trace,size:[host.clientWidth,host.clientHeight],error:game.error},null,2);},200);
function trackFrame(){if(game?.phase==='tearing'&&game.autoRun?.completed>0){if(lastWorld!==null)maxWorldJump=Math.max(maxWorldJump,Math.abs(game.stage.world.y-lastWorld));lastWorld=game.stage.world.y;}else lastWorld=null;requestAnimationFrame(trackFrame);}requestAnimationFrame(trackFrame);await seed(10);
</script></body></html>
