<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Win cinema motion review</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;background:#112333;color:#fff;overflow:auto}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;font:14px system-ui}button,select,a{padding:12px;background:#eef8ff;border:0;border-radius:4px;color:#173047}#view{width:720px;height:960px;max-width:100vw;aspect-ratio:3/4;margin:auto;position:relative}#view canvas{width:100%;height:100%}output{display:block;padding:12px}a[hidden]{display:none}</style></head><body><nav><select aria-label="Pokémon" id="species"><option>Charizard</option><option>Pidgeot</option><option>Scizor</option><option>Lugia</option></select><select aria-label="Win tier" id="tier"><option value="big">BIG WIN</option><option value="epic">MEGA WIN</option></select><button id="play">Play cutscene</button><button id="record">Record both tiers with sound</button><button data-time="0.7">Camera entrance</button><button data-time="1.72">Attack impact</button><button data-time="3.5">Mid count</button><button data-time="6.5">Final total</button><a id="download" hidden>Download recording</a></nav><div id="view"></div><output>Preparing scene…</output><script type="module">
import {Application,Assets,Sprite,Text,Container} from 'pixi.js';
import {WinCelebration,preloadWinCelebration} from '/src/game/WinCelebration.ts';
import {winCinemaPose,winCinemaGeometry} from '/src/game/winCinemaMotion.ts';
import {prepareWinActor} from '/src/game/WinCinemaStage.ts';
import {setSound,unlockAudio,preloadAudio,createAudioCapture,setBattleMusic} from '/src/game/audio.ts';
const app=new Application();await app.init({width:720,height:960,resolution:1,background:0x162c42,antialias:true});document.querySelector('#view').append(app.canvas);await document.fonts.ready;await preloadWinCelebration();await Promise.all(['Charizard','Pidgeot','Scizor','Lugia'].map(prepareWinActor));
const bg=new Sprite(await Assets.load('/assets/stage/pokemon-anime-arena-v2.png'));bg.width=1280;bg.height=960;bg.x=-280;app.stage.addChild(bg);
const label=new Text({text:'DEMO WIN',style:{fontFamily:'Nunito',fontWeight:'900',fontSize:40,fill:0xffffff}});label.anchor.set(.5);label.position.set(360,820);app.stage.addChild(label);
const layer=new Container();app.stage.addChild(layer);let win,amount,age=0,playing=false,exitAge=0,recording=false;const out=document.querySelector('output');
function start(species=document.querySelector('#species').value,tier=document.querySelector('#tier').value){win?.destroy();amount?.destroy();age=0;exitAge=0;win=new WinCelebration(tier,false,'fire',species,()=>{if(age<6.12){age=6.4;win.finish();}else exitAge=.001;});layer.addChild(win.root);amount=new Text({text:'$0.00',style:{fontFamily:'Nunito',fontWeight:'900',fontStyle:'italic',fontSize:100,fill:0xfff4c9,stroke:{color:0x0a2b44,width:4},dropShadow:{color:0x082135,distance:5,blur:0}},resolution:2});amount.anchor.set(.5);amount.eventMode='none';layer.addChild(amount);playing=true;return tier;}
function sample(){if(!win)return;const w=720,h=960,p=winCinemaPose(age,exitAge),g=winCinemaGeometry(w,h);win.update(age,w,h,exitAge);amount.text='$'+(p.count*(document.querySelector('#tier').value==='epic'?400:20)).toFixed(2);amount.position.set(g.x,g.amountY);amount.scale.set(1+p.amountPulse);amount.alpha=p.amountAlpha*p.alpha;out.textContent=(playing?'Playing':'Paused')+' · '+age.toFixed(2)+'s · '+(age<1.72?'skeletal performance':age<6.12?'award escalation':'final total');}
app.ticker.add(t=>{if(!win)return;const dt=Math.min(.05,t.deltaMS/1000);if(playing&&win.ready)age+=dt;if(exitAge)exitAge+=dt;sample();});
const sound=()=>{setSound(true);unlockAudio();preloadAudio();setBattleMusic(true);};document.querySelector('#play').onclick=()=>{sound();start();};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{if(!win)start();age=Number(b.dataset.time);playing=false;sample();});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#record').onclick=async()=>{if(recording)return;recording=true;win?.destroy();win=null;amount?.destroy();amount=null;sound();await sleep(600);const cap=createAudioCapture(),stream=app.canvas.captureStream(60);cap?.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:12000000}),parts=[];rec.ondataavailable=e=>parts.push(e.data);rec.onstop=()=>{const link=document.querySelector('#download');link.href=URL.createObjectURL(new Blob(parts,{type:rec.mimeType}));link.download='win-cinema-v35.webm';link.hidden=false;cap?.dispose();out.textContent='Recording ready · BIG then MEGA · live stereo game mix';recording=false;};rec.start();await sleep(450);document.querySelector('#tier').value='big';start('Charizard','big');await sleep(8200);exitAge=.001;await sleep(1000);document.querySelector('#tier').value='epic';start('Pidgeot','epic');await sleep(8200);exitAge=.001;await sleep(900);rec.stop();};out.textContent='Ready · native skeletons, moving camera, authored Spine impact frames';
</script></body></html>
