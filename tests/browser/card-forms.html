<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exact card forms QA</title><link rel="stylesheet" href="/src/styles.css"><style>body,html{overflow:auto;background:#071528;color:white}nav{display:flex;gap:12px;align-items:center;padding:10px}button,select{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto}</style></head><body><nav><select aria-label="Card form" id="card"></select><button id="play" disabled>Preview reveal</button><button id="finish">Finish reveal</button><button id="freeze">Freeze</button><output>Loading…</output></nav><div id="host" class="canvas-host"></div><script type="module">
import {OpeningStage} from '/src/game/Stage.ts';import {specialPokemon} from '/src/game/specialReward.ts';import {priceCard} from '/src/game/model.ts';import {setSound} from '/src/game/audio.ts';
const host=document.querySelector('#host'),out=document.querySelector('output'),select=document.querySelector('#card');
const stage=new OpeningStage(host,{reduced:false,low:false,onTear:()=>{},onNext:()=>{}});await stage.init();setSound(false);
const packs=await (await fetch('/assets/packs.json')).json(),art=await (await fetch('/assets/pokemon/manifest.json')).json(),catalogs=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const ids=['sv03-223','sv04.5-234','sv03-066','sv03-159','sv04.5-002','swsh8-271','swsh7-123','swsh11tg-TG17','swsh11-186','sv04.5-232','sma-SV69','swsh12-059','sv04.5-058','sma-SV49','sma-SV59','sv04.5-233','sv04.5-092','sv04.5-093'];const cards=ids.map(id=>priceCard(catalogs.find(c=>c.id===id)));
for(const card of cards){const option=document.createElement('option');option.value=card.id;option.textContent=card.name+' · '+card.id;select.append(option);}let busy=false;
document.querySelector('#play').onclick=async()=>{if(busy)return;busy=true;document.querySelector('#play').disabled=true;const card=cards.find(c=>c.id===select.value),image=specialPokemon(card,0,art);stage.reset();stage.setLayoutMode(true);stage.setScene(true);out.textContent='Loading '+(image??'card-only matching form')+'…';await stage.reveal(card,true,0,image,0);out.textContent='Complete · '+card.name+' · '+(image??'card-only: matching animated form unavailable');busy=false;document.querySelector('#play').disabled=false;};
document.querySelector('#finish').onclick=()=>stage.skipReveal();let frozen=false;document.querySelector('#freeze').onclick=()=>{frozen=!frozen;stage.setBlocked(frozen);};out.textContent='Ready';document.querySelector('#play').disabled=false;
</script></body></html>
