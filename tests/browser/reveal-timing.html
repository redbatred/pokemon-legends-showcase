<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special reveal timing QA</title><link rel="stylesheet" href="/src/styles.css"><style>body,html{overflow:auto;background:#08172a;color:white}nav{display:flex;gap:10px;align-items:center;padding:10px;flex-wrap:wrap}button,select{padding:8px}output{font:12px monospace;max-width:780px}#host{position:relative;width:1280px;height:780px;margin:auto}</style></head><body><nav><button id="start" disabled>Start delayed reveal</button><button id="release">Allow model to load</button><button id="skip">Try skip</button><button id="before">Freeze before impact</button><button id="after">Freeze after impact</button><button id="resume">Resume</button><button id="pause">Pause scene</button><button id="turbo">Toggle turbo</button><button id="fail">Fail model load</button><button id="phone">Phone</button><output>Loading</output></nav><div id="host" class="canvas-host"></div><script type="module">
import {OpeningStage} from '/src/game/Stage.ts';import {SpineReveal} from '/src/game/SpineReveal.ts';import {priceCard} from '/src/game/model.ts';import {specialPokemon} from '/src/game/specialReward.ts';import {setSound} from '/src/game/audio.ts';import {BALL_HIT} from '/src/game/ballPhysics.ts';
const host=document.querySelector('#host'),out=document.querySelector('output'),stage=new OpeningStage(host,{reduced:false,low:false,onTear:()=>{},onNext:()=>{lastSkip=stage.skipReveal();}});await stage.init();setSound(false);
const raw=await(await fetch('/assets/catalog.json')).json(),art=await(await fetch('/assets/pokemon/manifest.json')).json(),card=priceCard(raw.find(c=>c.id==='sv03-223')),image=specialPokemon(card,1000,art),create=SpineReveal.create.bind(SpineReveal);
let release,started=0,frontAt=null,finished=false,busy=false,lastSkip=null,freeze=null,held=false,modelAllowed=false,award=null,failModel=false,turbo=false;
SpineReveal.create=async(...args)=>{await new Promise(resolve=>release=resolve);if(failModel)throw new Error('Simulated model failure');return create(...args);};
stage.onSpecialWin=(c,immediate)=>{award={value:c.value,immediate:!!immediate};};
function report(){const front=!!stage.cardMesh&&stage.cardMesh.texture!==stage.getBackTexture();if(front&&frontAt===null)frontAt=Math.round(performance.now()-started);out.textContent=JSON.stringify({front,frontAtMs:frontAt,modelAllowed,finished,lastSkip,queued:stage.revealCompletion.requested,pokemon:!!stage.special?.hero.visible,ball:!!stage.special,flightTime:stage.special?Number(stage.timeline?.time().toFixed(2)):null,impactTime:BALL_HIT,held,turbo,cinematic:stage.scene.cinema.amount,charge:stage.scene.chargeLevel,award});}
stage.app.ticker.add(()=>{const time=stage.timeline?.time()??0;if(stage.special&&!held&&(freeze==='before'&&time>.45&&time<BALL_HIT||freeze==='after'&&time>BALL_HIT+.05)){held=true;stage.setBlocked(true);}report();});
document.querySelector('#start').onclick=()=>{if(busy)return;busy=true;started=performance.now();frontAt=null;finished=false;lastSkip=null;held=false;award=null;modelAllowed=false;stage.reset();stage.setLayoutMode(true);stage.setScene(true);stage.reveal(card,true,0,image,1000).then(()=>{finished=true;busy=false;report();});};
document.querySelector('#release').onclick=()=>{modelAllowed=true;release?.();report();};document.querySelector('#skip').onclick=()=>{lastSkip=stage.skipReveal();report();};
for(const when of ['before','after'])document.querySelector('#'+when).onclick=()=>{freeze=when;};
document.querySelector('#resume').onclick=()=>{held=false;freeze=null;stage.setBlocked(false);};document.querySelector('#phone').onclick=()=>{host.style.width='390px';host.style.height='780px';};
document.querySelector('#pause').onclick=()=>{held=true;stage.setBlocked(true);report();};document.querySelector('#turbo').onclick=()=>{turbo=!turbo;stage.updateOptions({reduced:false,turbo,low:false,onTear:()=>{},onNext:()=>{}});report();};document.querySelector('#fail').onclick=()=>{failModel=true;modelAllowed=true;release?.();report();};setInterval(report,100);document.querySelector('#start').disabled=false;report();
</script></body></html>
