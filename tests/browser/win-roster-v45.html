<!doctype html><html><head><meta charset="utf-8"><title>Win roster verification</title><style>body{background:#102738;color:white;font:16px system-ui}button{padding:14px}pre{white-space:pre-wrap}</style></head><body><button id="audit">Verify all 8 models</button><p id="status">Ready</p><pre id="report"></pre><div id="view"></div><script type="module">
import {prepareWinActor,WinCinemaStage,forgetWinActor} from '/src/game/WinCinemaStage.ts';
import {Mesh,Vector3} from 'three';
const manifest=await(await fetch('/assets/pokemon-3d/manifest.json')).json(),status=document.querySelector('#status'),report=document.querySelector('#report'),view=document.querySelector('#view');
document.querySelector('button').onclick=async()=>{document.querySelector('button').disabled=true;const results=[];for(const name of ['charizard','charizard-tera-dark','charizard-shiny-tera-dark','blastoise','pikachu-gigantamax','mewtwo','pidgeot','lugia']){let stage;try{status.textContent='Checking '+name+' · '+results.length+'/8';const source=await prepareWinActor('/assets/pokemon/'+name+'.png');if(!source)throw Error('Missing model');stage=new WinCinemaStage(source,true,true,'mega');view.replaceChildren(stage.canvas);let finite=true,origins=0;for(const [w,h] of [[390,844],[1280,720]])for(const time of [2.2,3.55,6.5]){stage.render(time,w,h);const points=stage.attackOrigins(w,h);origins=Math.max(origins,points.length);finite&&=points.length>0&&points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));}results.push({name,ok:finite,origins});stage.destroy();stage=null;forgetWinActor(name);await new Promise(r=>setTimeout(r,20));}catch(e){results.push({name,ok:false,error:String(e)});stage?.destroy();}report.textContent=JSON.stringify(results);}status.textContent='Finished '+results.filter(r=>r.ok).length+'/'+results.length+' · '+results.filter(r=>!r.ok).length+' failures';};
</script></body></html>
