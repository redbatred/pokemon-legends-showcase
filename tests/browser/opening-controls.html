<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening controls QA</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#09182c}nav{display:flex;gap:12px;padding:10px;align-items:center;flex-wrap:wrap}nav button{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto;overflow:hidden}output{font:12px monospace;white-space:pre-wrap;color:white;max-width:700px}</style></head><body><nav><button id="desktop">Desktop</button><button id="phone">Phone</button><button id="small">Small phone</button><button id="landscape">Landscape</button><button id="narrow">Narrow landscape</button><output>Loading</output></nav><div class="canvas-host" id="host"></div><script type="module">
import {PokemonGame} from '/src/game/Game.ts';
import {newSave} from '/src/game/model.ts';
let save={...newSave(),balance:10000000};
const host=document.querySelector('#host'),out=document.querySelector('output');
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>(save=newSave())});
// Settings, like credits, stay in memory in this regression fixture.
game.settings=()=>{game.stage.updateOptions({reduced:game.reduced,turbo:game.turbo,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};
await game.init();
for(const [id,w,h] of [['desktop',1280,780],['phone',390,780],['small',320,568],['landscape',844,390],['narrow',568,320]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};
setInterval(()=>{const hits=[...host.querySelectorAll('[data-control^="pack-"]')],b=host.getBoundingClientRect();out.textContent=JSON.stringify({phase:game.phase,index:game.index,selected:game.selectedId,completed:save.history.length,reveal:save.active?{expected:save.active.cards[game.index]?.value,award:game.view?.rewards?.flights?.find(f=>f.index===game.index)?.label.state.value,total:game.view?.rewards?.ledger.total,pokemon:!!game.stage.special?.hero.visible,ball:game.stage.special?.ball.visible}:null,auto:game.autoRun?{running:game.autoRun.running,completed:game.autoRun.completed,total:game.autoRun.total}:null,turbo:game.turbo,packChoices:hits.length,allVisible:hits.every(el=>{const r=el.getBoundingClientRect();return r.left>=b.left&&r.right<=b.right+1&&r.bottom<=b.bottom+1}),size:[host.clientWidth,host.clientHeight]});},200);
</script></body></html>
