<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening controls QA</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#09182c}nav{display:flex;gap:12px;padding:10px;align-items:center;flex-wrap:wrap}nav button{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto;overflow:hidden}output{font:12px monospace;white-space:pre-wrap;color:white;max-width:700px}</style></head><body><nav><button id="desktop">Desktop</button><button id="phone">Phone</button><button id="small">Small phone</button><button id="landscape">Landscape</button><button id="narrow">Narrow landscape</button><button id="cut-cue">Show cut cue</button><button id="freeze-handoff">Freeze handoff</button><button id="freeze-flight">Freeze flight</button><button id="freeze-release">Freeze release</button><button id="freeze-formation">Freeze formation</button><button id="freeze-collection">Freeze collection</button><button id="resume">Resume</button><output>Loading</output></nav><div class="canvas-host" id="host"></div><script type="module">
import {PokemonGame} from '/src/game/Game.ts';
import {newSave} from '/src/game/model.ts';
import {setSound} from '/src/game/audio.ts';
import {Howl} from 'howler';
const heard=[];const realPlay=Howl.prototype.play;Howl.prototype.play=function(...args){const source=String(this._src);if(/battle|flight|release|ambience/.test(source))heard.push(source.split('/').pop());return realPlay.apply(this,args);};
let save={...newSave(),balance:10000000};
const host=document.querySelector('#host'),out=document.querySelector('output');
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>(save=newSave())});
// Settings, like credits, stay in memory in this regression fixture.
game.settings=()=>{setSound(game.sound);game.stage.updateOptions({reduced:game.reduced,turbo:game.turbo,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};
await game.init();
let freeze=null,frozen=false;document.querySelector('#cut-cue').onclick=()=>{game.stage.packHovered=true;};
for(const name of ['handoff','flight','release','formation','collection'])document.querySelector('#freeze-'+name).onclick=()=>{freeze=name;};
document.querySelector('#resume').onclick=()=>{frozen=false;freeze=null;game.stage.timeline?.resume();game.view?.modalTween?.resume();game.stage.app.start();};
game.stage.app.ticker.add(()=>{if(!freeze||frozen)return;if(freeze==='handoff'&&(game.stage.openingUiTime??0)>2.1){freeze=null;frozen=true;game.stage.timeline?.pause();game.stage.app.stop();return;}const sp=game.stage.special;if(!sp)return;const time=game.stage.timeline?.time()??0,releaseAge=sp.releaseFx.state.getCurrent(0)?.trackTime??0;if(freeze==='flight'&&sp.flightFx.visible&&time>.72||freeze==='release'&&sp.releaseFx.visible&&releaseAge>.20||freeze==='formation'&&sp.emergence.progress>.72){freeze=null;frozen=true;game.stage.timeline.pause();game.stage.app.stop();}});

for(const [id,w,h] of [['desktop',1280,780],['phone',390,780],['small',320,568],['landscape',844,390],['narrow',568,320]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};
setInterval(()=>{if(freeze==='collection'&&game.view?.modalKind==='results'&&(game.view?.modalTween?.time()??0)>.38){freeze=null;frozen=true;game.view.modalTween.pause();game.stage.app.stop();}const hits=[...host.querySelectorAll('[data-control^="pack-"]')],b=host.getBoundingClientRect();out.textContent=JSON.stringify({phase:game.phase,index:game.index,selected:game.selectedId,completed:save.history.length,frozen,modal:game.view?.modalKind,arrival:game.view?.modalTween?.time(),journey:game.stage.openingUiTime,tray:{offset:Math.round(game.view?.trayOffset.value??0),max:Math.round(game.view?.trayPan.max??0),landed:game.view?.landed.size},heard:heard.slice(-5),tease:game.stage.previousTease,reveal:save.active?{expected:save.active.cards[game.index]?.value,award:game.view?.rewards?.flights?.find(f=>f.index===game.index)?.label.state.value,total:game.view?.rewards?.ledger.total,pokemon:!!game.stage.special?.hero.visible,emergence:game.stage.special?.emergence.progress,formation:!!game.stage.special?.formationFx.visible,ball:game.stage.special?.ball.visible}:null,auto:game.autoRun?{running:game.autoRun.running,completed:game.autoRun.completed,total:game.autoRun.total}:null,turbo:game.turbo,packChoices:hits.length,allVisible:hits.every(el=>{const r=el.getBoundingClientRect();return r.left>=b.left&&r.right<=b.right+1&&r.bottom<=b.bottom+1}),size:[host.clientWidth,host.clientHeight]});},200);
</script></body></html>
