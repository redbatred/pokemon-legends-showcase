<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequential pack → Legendary Capture</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;background:#122536;color:#e9f2f7;overflow:auto}nav{display:flex;flex-wrap:wrap;gap:10px;padding:12px;font:15px system-ui}button,a,select{min-height:44px;padding:10px 16px;border:0;border-radius:4px;background:#fff4dc;color:#17374c;font:700 14px system-ui}#viewport{position:relative;width:720px;aspect-ratio:3/4;height:auto;margin:auto;max-width:100vw}#host,#encounter{position:absolute;inset:0;width:100%;height:100%;border:0}#encounter{visibility:hidden}output{display:block;padding:12px;font:14px system-ui;max-width:720px;margin:auto}#download[hidden]{display:none}@media(max-width:600px){#viewport{width:390px;height:auto}}</style></head><body><nav><a href="?pokemon=lugia">Lugia</a><a href="?pokemon=mewtwo">Mewtwo</a><select id="outcome" aria-label="Demo outcome"><option value="capture">Capture</option><option value="escape">Escape</option></select><button id="record" disabled>Record sequential walkthrough</button><a id="download" hidden>Download recording</a></nav><div id="viewport"><div id="host" class="canvas-host"></div><iframe id="encounter" title="Legendary encounter" allow="autoplay"></iframe></div><output>Loading actual pack stage and capture scene…</output><script type="module">
import {Assets} from 'pixi.js';
import {PokemonGame} from '/src/game/Game.ts';
import {priceCard,newSave,energy,DEFAULT_PACK} from '/src/game/model.ts';
import {setSound,setBattleMusic,unlockAudio,createAudioCapture} from '/src/game/audio.ts';
const query=new URLSearchParams(location.search),species=query.get('pokemon')==='mewtwo'?'mewtwo':'lugia',host=document.querySelector('#host'),frame=document.querySelector('#encounter'),out=document.querySelector('output'),button=document.querySelector('#record'),link=document.querySelector('#download'),choice=document.querySelector('#outcome');
frame.src='/output/capture-motion-v25/index.html?pokemon='+species+'&embed=1';
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const ids=['sv03-004','sv03-001','sv03-004','sv03-026','sv03-001','sv03-004',...Array(4).fill('sv03-001')];
let save={...newSave(),balance:100000,active:{id:'sequential-v25-'+species,at:new Date().toISOString(),cards:[...ids.map(id=>priceCard(raw.find(c=>c.id===id))),energy],showdownSymbols:[1,3,5],pack:DEFAULT_PACK}};
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});game.openPendingShowdown=()=>{game.showdownPending=false;};game.sound=true;game.reduced=false;game.turbo=false;game.settings=()=>{setSound(true);game.stage.updateOptions({reduced:false,turbo:false,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};game.settings();await game.init();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function until(check){const deadline=performance.now()+60000;while(!check()){if(game.error)throw Error(game.error);if(performance.now()>deadline)throw Error('Timed out waiting for animation');await sleep(40);}}
const receiverTexture=await Assets.load('/output/capture-motion-v25/assets/receiver.png');
await until(()=>frame.contentWindow.captureDemo);const demo=frame.contentWindow.captureDemo;button.disabled=false;out.textContent='Ready · cards reveal individually · symbols on cards 2, 4 and 6 · third collected symbol opens capture';
let active=false,handoff=false,entering=false,transitionAt=0,returned=false,automatic=false,entryPromise,recordStarted=0,events=[];const freeze=document.createElement('canvas'),entryFreeze=document.createElement('canvas');freeze.width=entryFreeze.width=720;freeze.height=entryFreeze.height=960;
host.addEventListener('legendary-bonus-ready',()=>{if(entering)return;entering=true;entryPromise=(async()=>{
 events.push({name:'Third symbol collected',time:(performance.now()-recordStarted)/1000});out.textContent='3 / 3 collected · opening legendary encounter';await sleep(650);
 game.controls.inert=true;game.stage.blocked=true;
 await game.stage.showdownSymbols.transferToReceiver(receiverTexture);
 game.stage.app.renderer.render(game.stage.app.stage);freeze.getContext('2d').drawImage(host.querySelector('canvas'),0,0,720,960);game.stage.setBlocked(true);setBattleMusic(false);setSound(false);
 entryFreeze.getContext("2d").drawImage(freeze,0,0);handoff=true;demo.setEntryBackdrop(freeze);game.stage.showdownSymbols.finishReceiverTransfer();game.stage.showdownSymbols.setBlocked(false);game.stage.app.renderer.render(game.stage.app.stage);freeze.getContext('2d').clearRect(0,0,720,960);freeze.getContext('2d').drawImage(host.querySelector('canvas'),0,0,720,960);demo.setExitBackdrop(freeze);game.stage.showdownSymbols.setBlocked(true);await demo.start(choice.value,automatic);active=true;handoff=false;transitionAt=performance.now();frame.style.visibility='visible';
 events.push({name:species+' '+choice.value,time:(performance.now()-recordStarted)/1000});
 await until(()=>!demo.running);await sleep(300);active=false;returned=true;frame.style.visibility='hidden';game.stage.showdownSymbols.finishReceiverTransfer();game.controls.inert=false;game.stage.setBlocked(false);setSound(true);out.textContent='Encounter finished · pack resumes at the same card';
 })();entryPromise.catch(e=>out.textContent=String(e));});
button.onclick=async()=>{button.disabled=true;choice.disabled=true;automatic=true;let recorder,mix,cap,raf;try{
 setSound(true);unlockAudio();cap=createAudioCapture();if(!cap)throw Error('Game audio capture unavailable');const encounterAudio=await demo.prepare();
 const canvas=document.createElement('canvas');canvas.width=720;canvas.height=960;const ctx=canvas.getContext('2d',{alpha:false});
 const draw=()=>{ctx.fillStyle='#122536';ctx.fillRect(0,0,720,960);if(handoff){ctx.drawImage(entryFreeze,0,0,720,960);}else if(active){ctx.drawImage(demo.canvas,0,0,720,960);}else{game.stage.app.renderer.render(game.stage.app.stage);ctx.drawImage(host.querySelector('canvas'),0,0,720,960);}raf=requestAnimationFrame(draw);};draw();
 mix=new AudioContext({sampleRate:48000});await mix.resume();const destination=mix.createMediaStreamDestination(),normal=mix.createMediaStreamSource(cap.stream),normalGain=mix.createGain();normalGain.gain.value=1.8;normal.connect(normalGain).connect(destination);mix.createMediaStreamSource(encounterAudio).connect(destination);
 const stream=canvas.captureStream(60);destination.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const chunks=[];recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:10000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{cancelAnimationFrame(raf);link.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));link.download='sequential-v25-'+species+'-'+choice.value+'.webm';link.hidden=false;stream.getTracks().forEach(t=>t.stop());cap.dispose();mix.close();out.textContent='Recording ready · normal pack → 3 collected symbols → '+species+' '+choice.value+' → pack resumes · stereo sound';};
 recorder.start(100);recordStarted=performance.now();await sleep(450);game.action('tear');await until(()=>game.phase==='awaiting');await sleep(400);
 for(let i=0;i<6;i++){game.action('next');await until(()=>game.phase==='revealed'&&game.index===i);events.push({name:'Card '+(i+1)+(i%2?' · bonus':''),time:(performance.now()-recordStarted)/1000});await sleep(i%2?2200:750);}
 await entryPromise;await sleep(850);game.action('next');await until(()=>game.phase==='revealed'&&game.index===6);await sleep(850);recorder.stop();console.info('Walkthrough chapters',JSON.stringify(events));
 }catch(e){if(recorder?.state==='recording')recorder.stop();out.textContent=String(e);button.disabled=false;}};
</script></body></html>
