<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Normal pack · bonus symbols</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#071528;color:white;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px;font:14px system-ui}button,a{padding:10px 14px;color:#17374c;background:#fff5df;border:0;border-radius:5px;font:700 14px system-ui}#host{position:relative;width:720px;height:960px;margin:auto;max-width:100vw}#note{font:13px system-ui;padding:10px}output{display:block;font:12px monospace;padding:10px}@media(max-width:600px){#host{width:390px;height:760px}}</style></head><body><nav><a href="?specials=1">One bonus symbol</a><a href="?specials=2">Two bonus symbols</a><button id="record" disabled>Record normal pack</button><a id="download" hidden>Download recording</a></nav><div id="note">Normal pack · 1 or 2 bonus symbols · no bonus entry until 3</div><div id="host" class="canvas-host"></div><output>Loading…</output><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {priceCard,newSave,energy,DEFAULT_PACK} from '/src/game/model.ts';import {setSound,unlockAudio,createAudioCapture} from '/src/game/audio.ts';
const count=new URLSearchParams(location.search).get('specials')==='1'?1:2,host=document.querySelector('#host'),out=document.querySelector('output'),button=document.querySelector('#record'),link=document.querySelector('#download');
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const ids=['sv03-001','sv03-026',...Array(8).fill('sv03-004')];
let save={...newSave(),balance:100000,active:{id:'normal-specials-v21-'+count,at:new Date().toISOString(),cards:[...ids.map(id=>priceCard(raw.find(c=>c.id===id))),energy],showdownSymbols:Array.from({length:count},(_,i)=>i),pack:DEFAULT_PACK}};
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});game.sound=true;game.reduced=false;game.turbo=false;game.settings=()=>{setSound(true);game.stage.updateOptions({reduced:false,turbo:false,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};game.settings();await game.init();button.disabled=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function until(check){const deadline=performance.now()+45000;while(!check()){if(game.error)throw Error(game.error);if(performance.now()>deadline)throw Error('Timed out waiting for card reveal');await sleep(50);}}
button.onclick=async()=>{button.disabled=true;let recorder,cap;try{setSound(true);unlockAudio();cap=createAudioCapture();if(!cap)throw Error('Audio capture unavailable');const stream=host.querySelector('canvas').captureStream(60);cap.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let chunks=[];recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:10000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{link.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));link.download='normal-bonus-v21-'+count+'.webm';link.hidden=false;stream.getTracks().forEach(t=>t.stop());cap.dispose();out.textContent='Recording ready · '+count+' bonus symbol(s) · stereo game audio';};recorder.start(100);await sleep(350);game.action('tear');await until(()=>game.phase==='awaiting');await sleep(350);for(let i=0;i<count;i++){game.action('next');await until(()=>game.phase==='revealed');await sleep(1900);}recorder.stop();}catch(e){if(recorder?.state==='recording')recorder.stop();out.textContent=String(e);button.disabled=false;}};
setInterval(()=>{if(!link.hidden)return;out.textContent=JSON.stringify({phase:game.phase,index:game.index,specials:count,cueVisible:game.stage.showdownBadge?.visible,error:game.error});},200);
</script></body></html>
