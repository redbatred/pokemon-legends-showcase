<!doctype html><html><head><meta charset="utf-8"><title>Pressure rig inspection</title><style>body{margin:0;background:#152b39;color:white;font:16px system-ui}button{padding:12px;margin:10px}canvas{display:block}pre{white-space:pre-wrap}</style></head><body><button id="burst">Ball aperture</button><button id="landing">Foot contact</button><button id="play">Play both</button><pre id="report">Loading…</pre><script type="module">
import {Application,Container} from 'pixi.js';import {Spine} from '@esotericsoftware/spine-pixi-v8';import {loadPressureRig} from '/src/game/PressureRig.ts';
const app=new Application();await app.init({width:800,height:400,background:0x152b39,resolution:1});document.body.append(app.canvas);const data=await loadPressureRig();const rigs=['burst','landing'].map((name,i)=>{const r=new Spine({skeletonData:data,autoUpdate:false});r.state.setAnimation(0,name,false);r.position.set(i?590:200,250);if(!i)r.scale.set(.7);app.stage.addChild(r);return r;});let clock=.16,playing=false;function sample(){rigs.forEach(r=>{r.state.getCurrent(0).trackTime=clock;r.update(0);});document.querySelector('#report').textContent='Spine slots: '+data.slots.length+' · time '+clock.toFixed(2)+' · original vector artwork';}sample();app.ticker.add(t=>{if(playing){clock=(clock+t.deltaMS/1000)%1.4;sample();}});document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#burst').onclick=()=>{playing=false;clock=.16;sample();};document.querySelector('#landing').onclick=()=>{playing=false;clock=.35;sample();};
</script></body></html>
