<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Win cinema lab</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;overflow:auto;background:#121725;color:#fff;font:13px Arial}#host{width:540px;height:720px;position:relative}#host>canvas{width:100%;height:100%;display:block}#sheet{display:block}output{display:block;padding:6px}</style></head><body><output>Loading…</output><canvas id="sheet" width="10" height="10"></canvas><div id="host"></div><script src="/tests/browser/virtual-clock.js"></script><script type="module">
// Deterministic contact sheets of the isolated win cinematic. Local speakers stay muted.
import {Application,BitmapFont} from 'pixi.js';import {WinCinema,preloadWinCinema} from '/src/game/WinCinema.ts';import {MoneyReadout} from '/src/game/MoneyReadout.ts';import {winCinemaPose,winCinemaGeometry} from '/src/game/winCinemaMotion.ts';import {winAmountBody,winScoreHit} from '/src/game/winContinuity.ts';import {setAudioMonitorMuted,setSound} from '/src/game/audio.ts';
setAudioMonitorMuted(true);setSound(false);const font=await new FontFace('Nunito','url(/assets/fonts/Nunito.ttf)').load();document.fonts.add(font);BitmapFont.install({name:'LegendsMoney',style:{fontFamily:'Nunito',fontSize:64,fontWeight:'900',fill:0xffffff},chars:'0123456789$.,+- ',resolution:2});
const query=new URLSearchParams(location.search),W=Number(query.get('w')??540),H=Number(query.get('h')??720);document.querySelector('#host').style.cssText=`width:${W}px;height:${H}px`;
const app=new Application();await app.init({width:W,height:H,resolution:1,antialias:true,backgroundAlpha:0,preserveDrawingBuffer:true});document.querySelector('#host').append(app.canvas);app.stop();const out=document.querySelector('output');let cinema,label,labelWidth=1,tier='big',value=2000,last=0;
const options={charizard:['big',2000],blastoise:['mega',8000],pikachu:['epic',20000],mewtwo:['legendary',50000]};
async function load(species,forcedTier){cinema?.destroy();label?.destroy();[tier,value]=options[species]??['big',2000];if(forcedTier)tier=forcedTier;await preloadWinCinema(species);cinema=new WinCinema(tier,species,false,()=>{},'/assets/pokemon/'+species+'.png');app.stage.addChild(cinema.root);label=new MoneyReadout({identity:species,value:0,target:value,remaining:0},{size:32,cinematic:true,color:0xffffff,align:'center',width:600,plus:false,centerY:true,hero:false,reduced:true,ticks:false,draw:()=>{}});app.stage.addChild(label);labelWidth=label.getLocalBounds().width;while(!cinema.ready)await new Promise(r=>setTimeout(r,20));last=0;out.textContent='Ready · '+species+' · '+tier;}
function draw(age,exit=0){cinema.update(age,W,H,exit);const g=winCinemaGeometry(W,H,tier==='legendary',age),p=winCinemaPose(age,exit,tier),b=winAmountBody(age);label.display(value*p.count);label.cinema(age,false,winScoreHit(age,tier));const amount=cinema.amountPose?.(W,H)??{x:g.x,y:g.amountY};const size=Math.min(g.size/32,g.amountWidth/labelWidth);label.position.set(amount.x,amount.y+b.lift*H-(b.y-1)*size*32*.64);label.scale.set(size*b.x,size*b.y);label.alpha=p.amountAlpha;app.render();}
// Simulate at 60 fps from the scene entry so stateful followers match live play.
/** `exitFrom`: age at which the player advances; later ages render the return to the game. */
async function sheet(ages,cols=6,scale=.5,from=1.73,exitFrom=Infinity){const canvas=document.querySelector('#sheet'),tw=Math.round(W*scale),th=Math.round(H*scale),rows=Math.ceil(ages.length/cols);canvas.width=tw*cols;canvas.height=th*rows;const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const sorted=[...ages].sort((a,b)=>a-b);let i=0;const times=[];for(let t=from;i<sorted.length;t+=1/60){const start=virtualClock.realNow();draw(Math.min(t,exitFrom),Math.max(0,t-exitFrom));times.push(virtualClock.realNow()-start);while(i<sorted.length&&t>=sorted[i]-1e-6){ctx.drawImage(app.canvas,(i%cols)*tw,Math.floor(i/cols)*th,tw,th);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText(sorted[i].toFixed(2),(i%cols)*tw+4,Math.floor(i/cols)*th+12);i++;}if(times.length%30===0)await new Promise(r=>setTimeout(r,0));}times.sort((a,b)=>a-b);return {frames:times.length,p50:+times[times.length>>1].toFixed(2),p95:+times[Math.floor(times.length*.95)].toFixed(2),max:+times.at(-1).toFixed(2)};}
window.lab={load,draw,sheet,get cinema(){return cinema;},app};await load(query.get('species')??'charizard',query.get('tier'));
</script></body></html>
