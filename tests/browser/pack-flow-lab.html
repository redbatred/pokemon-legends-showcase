<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack flow lab</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;background:#122536;color:#edf6ff;overflow:auto;font:13px Arial}#host{width:540px;height:720px;position:relative}#sheet{display:block}output{display:block;padding:6px}</style></head><body><output>Loading game…</output><canvas id="sheet" width="10" height="10"></canvas><div id="host" class="canvas-host"></div><script src="/tests/browser/virtual-clock.js"></script><script type="module">
// Actual game flow (pack → special reveal → win cinematic → return) captured into contact sheets.
import {UPDATE_PRIORITY} from 'pixi.js';import {winPokemonImage} from '/src/game/winPresentationIdentity.ts';import {PokemonGame} from '/src/game/Game.ts';import {newSave,priceCard,energy,DEFAULT_PACK} from '/src/game/model.ts';import {setAudioMonitorMuted,setSound,unlockAudio} from '/src/game/audio.ts';import {Howl} from 'howler';import {preloadWinCinema} from '/src/game/WinCinema.ts';
const query=new URLSearchParams(location.search),W=Number(query.get('w')??540),H=Number(query.get('h')??720);document.querySelector('#host').style.cssText=`width:${W}px;height:${H}px`;
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const fixtures={charizard:'sv03-215',blastoise:'sv03.5-200',pikachu:'swsh11tg-TG17',mewtwo:'swsh12.5gg-GG44'},find=key=>raw.find(c=>c.id===(fixtures[key]??key)),order=(query.get('cards')??'sv03-001:25,sv03-026:90,sv03-004:250').split(',').map(entry=>{const [name,value]=entry.split(':');const card=priceCard(find(name));return value===undefined?card:{...card,value:Number(value)};}),filler={...priceCard(find(query.get('fill')??'sv03-004')),value:Number(query.get('fillValue')??0)},bonus=(query.get('bonus')??'').split(',').filter(Boolean).map(Number);
let save={...newSave(),balance:100000,active:query.has('browse')?null:{id:'pack-flow-lab',at:new Date().toISOString(),cards:[...[...order,...Array(10).fill(filler)].slice(0,10),energy],showdownSymbols:bonus,pack:DEFAULT_PACK}};
const game=new PokemonGame(document.querySelector('#host'),{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});window.flowGame=game;const winAge=()=>{try{return game.view?.rewards?.flights?.[0]?.age??-1;}catch{return -1;}};const sound=query.has('sound'),played=[];if(sound){const play=Howl.prototype.play;Howl.prototype.play=function(...args){const id=play.apply(this,args);if(typeof args[0]!=='number')played.push({cue:String(this._src).split('/').slice(-2).join('/'),win:+winAge().toFixed(2),phase:game.phase});return id;};}
game.sound=sound;game.reduced=false;game.turbo=false;game.settings=()=>{setSound(sound);game.stage.updateOptions({reduced:false,turbo:false,low:false,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};game.settings();await game.init();if(sound){setSound(true);unlockAudio();}setAudioMonitorMuted(true);await Promise.all(order.filter(c=>c.value>=2000).map(c=>preloadWinCinema(winPokemonImage(c)??c.name)));
const out=document.querySelector('output'),sleep=ms=>new Promise(r=>setTimeout(r,ms)),channel=new MessageChannel(),waiting=[];channel.port1.onmessage=()=>waiting.shift()?.();const breathe=()=>new Promise(r=>{waiting.push(r);channel.port2.postMessage(0);});async function until(check,limit=60000){const end=performance.now()+limit;while(!check()){if(game.error)throw Error(game.error);if(performance.now()>end)throw Error('timed out');await sleep(30);}}

/** Step the virtual clock and tile one frame every `every` seconds. `from`/`to` are optional win ages. */
async function film({seconds=8,every=.25,cols=8,scale=.2,start=()=>true,stop=()=>false,crop=null}={}){virtualClock.manual();const area=crop??{x:0,y:0,w:W,h:H},canvas=document.querySelector('#sheet'),tw=Math.round(area.w*scale),th=Math.round(area.h*scale),count=Math.ceil(seconds/every);canvas.width=tw*cols;canvas.height=th*Math.ceil(count/cols);const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);let shot=0,elapsed=0,started=false,guard=0;const costs=[];
 while(shot<count&&guard++<20000){const t=virtualClock.realNow();virtualClock.step();costs.push(virtualClock.realNow()-t);if(game.error)throw Error(game.error);if(!started&&start())started=true;if(!started){await breathe();continue;}elapsed+=1/60;if(elapsed>=shot*every){{const source=game.stage.app.canvas,k=source.width/W;ctx.drawImage(source,area.x*k,area.y*k,area.w*k,area.h*k,(shot%cols)*tw,Math.floor(shot/cols)*th,tw,th);}ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.fillText(elapsed.toFixed(2)+' w'+winAge().toFixed(2)+' '+game.phase,(shot%cols)*tw+3,Math.floor(shot/cols)*th+11);shot++;}if(stop())break;await breathe();}
 virtualClock.auto();costs.sort((a,b)=>a-b);return {frames:costs.length,p50:+costs[costs.length>>1].toFixed(1),p95:+costs[Math.floor(costs.length*.95)].toFixed(1),max:+costs.at(-1).toFixed(1)};}
/** Run a long job without holding the tool call open; poll `flow.job`. */
function job(work){flow.job={done:false};work().then(result=>flow.job={done:true,result},error=>flow.job={done:true,error:String(error)});}
/** Step frames without capturing until a condition holds. */
async function advance(check,seconds=45){virtualClock.manual();const end=virtualClock.realNow()+seconds*1000;for(let i=0;!check()&&virtualClock.realNow()<end;i++){virtualClock.step();if(game.error)throw Error(game.error);await breathe();if(i%4===3)await sleep(1);}virtualClock.auto();if(!check())throw Error('advance timed out in '+game.phase);}
async function open(){game.action('tear');await advance(()=>game.phase==='awaiting');}
/** Reveal the next card; resolves when the reveal action has started. */
function next(){game.action('next');}
window.flow={game,open,next,film,advance,job,until,sleep,winAge,played};out.textContent='Ready';
// Review runs name themselves in the URL (&tag= for stills, &job=perf for frame costs) and start on their own.
if(query.has('tag')||query.has('job')){const helper=document.createElement('script');helper.src='/tests/browser/ng-helpers.js';document.head.append(helper);}
</script></body></html>
