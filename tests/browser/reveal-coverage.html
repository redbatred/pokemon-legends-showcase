<!doctype html><html><head><meta charset="utf-8"><title>Special Pokémon render audit</title><style>body{background:#c9d8e4;color:#102333;font:14px system-ui}button{padding:12px}#results{display:flex;flex-wrap:wrap}figure{width:175px;margin:5px;background:#b7ccda;padding:5px}img{width:175px;height:175px;object-fit:contain}figcaption{overflow-wrap:anywhere}.fail{background:#ffaaaa}</style></head><body><button id="run">Audit all models</button><output>Ready</output><div id="results"></div><pre id="report"></pre><script type="module">
import {createPokemonModel} from '/src/game/PokemonModel.ts';
const manifest=await(await fetch('/assets/pokemon-3d/manifest.json')).json();
const run=document.querySelector('#run'),out=document.querySelector('output'),results=document.querySelector('#results'),report=document.querySelector('#report');
run.onclick=async()=>{run.disabled=true;const rows=[];for(const stem of Object.keys(manifest)){out.textContent='Checking '+stem;let model;const row={stem,samples:[]};try{model=await createPokemonModel('/assets/pokemon/'+stem+'.png',true);if(!model)throw Error('Missing model');const canvas=model.texture.source.resource,context=canvas.getContext('2d');const sample=(pose)=>{model.capturePose();const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;let opaque=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>16)opaque++;row.samples.push({pose,opaque});};sample('idle');model.play('emerge');for(const t of [0,.5,1]){model.setEntranceTime(t*model.entranceDuration);sample('entrance '+t);}model.play('charge');for(const t of [0,.33,.66,1]){model.setAttackTime(t*(model.chargeDuration+model.attackDuration+model.recoveryDuration));sample('attack '+t);}model.play('recover');model.update(.4);sample('recover');row.frame={bodyHeight:model.bodyHeight,frameWidth:model.frameWidth,anchor:model.horizontalAnchor,ground:model.groundY};const figure=document.createElement('figure'),image=new Image(),label=document.createElement('figcaption');image.src=canvas.toDataURL();label.textContent=stem+' · min '+Math.min(...row.samples.map(s=>s.opaque));figure.append(image,label);if(row.samples.some(s=>s.opaque<100))figure.className='fail';results.append(figure);}catch(e){row.error=String(e);}finally{model?.dispose();}rows.push(row);report.textContent=JSON.stringify(rows,null,2);await new Promise(requestAnimationFrame);}out.textContent='Complete · '+rows.length+' models · '+rows.filter(r=>r.error||r.samples.some(s=>s.opaque<100)).length+' failures';run.disabled=false;};
</script></body></html>
