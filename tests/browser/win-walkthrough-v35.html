<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big win cinematic walkthrough</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;background:#122536;color:#edf6ff;overflow:auto}nav{display:flex;gap:10px;padding:12px;font:14px system-ui}button,a{padding:12px;background:#fff1d1;border:0;border-radius:4px;color:#17354b;font:700 14px system-ui}#host{width:720px;height:960px;max-width:100vw;margin:auto;position:relative}output{display:block;padding:12px}a[hidden]{display:none}</style></head><body><nav><button id="record" disabled>Record in-game wins with sound</button><a id="download" hidden>Download recording</a><a id="chapters" hidden>Download chapters</a></nav><div id="host" class="canvas-host"></div><output>Loading game…</output><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {newSave,priceCard,energy,DEFAULT_PACK} from '/src/game/model.ts';import {setSound,unlockAudio,createAudioCapture} from '/src/game/audio.ts';import {preloadWinCinema} from '/src/game/WinCinema.ts';
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();const cards=['sv03-215','sv03-225'].map((id,i)=>({...priceCard(raw.find(c=>c.id===id)),value:i?8000:2000}));
let save={...newSave(),balance:100000,active:{id:'cinema-v35',at:new Date().toISOString(),cards:[...cards,energy],showdownSymbols:[],pack:DEFAULT_PACK}};const game=new PokemonGame(document.querySelector('#host'),{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});game.sound=true;game.reduced=false;game.turbo=false;game.settings=()=>{setSound(true);game.stage.updateOptions({reduced:false,turbo:false,low:false,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};game.settings();await game.init();await Promise.all(cards.map(c=>preloadWinCinema(c.name)));
const button=document.querySelector('#record'),out=document.querySelector('output'),link=document.querySelector('#download');button.disabled=false;out.textContent='Ready · actual game · mock Charizard BIG / Pidgeot MEGA / pack result';const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function until(check){const end=performance.now()+60000;while(!check()){if(game.error)throw Error(game.error);if(performance.now()>end)throw Error('Animation timed out');await sleep(40);}}
button.onclick=async()=>{button.disabled=true;try{setSound(true);unlockAudio();const audio=createAudioCapture(),stream=game.stage.app.canvas.captureStream(60);audio?.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:12000000}),parts=[],events=[],start=performance.now();const chapter=name=>events.push({name,time:(performance.now()-start)/1000});rec.ondataavailable=e=>parts.push(e.data);rec.onstop=()=>{link.href=URL.createObjectURL(new Blob(parts,{type:rec.mimeType}));link.download='win-walkthrough-v35.webm';link.hidden=false;const json=document.querySelector('#chapters');json.href=URL.createObjectURL(new Blob([JSON.stringify(events)],{type:'application/json'}));json.download='win-walkthrough-v35-chapters.json';json.hidden=false;audio?.dispose();out.textContent='Recording ready · real game and live stereo audio';};rec.start();await sleep(400);chapter('Open pack');game.action('tear');await until(()=>game.phase==='awaiting');for(let i=0;i<2;i++){chapter(i?'Pidgeot · MEGA WIN':'Charizard · BIG WIN');game.action('next');await until(()=>game.phase==='revealed'&&game.index===i);await sleep(7400);}chapter('Collect and pack result');game.action('all');await until(()=>game.phase==='complete');await sleep(8200);chapter('Return to pack summary');const canvas=game.stage.app.canvas,rect=canvas.getBoundingClientRect();for(const type of ['pointerdown','pointerup'])canvas.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'mouse',isPrimary:true,clientX:rect.x+rect.width*.88,clientY:rect.y+rect.height*.88,button:0,buttons:type==='pointerdown'?1:0}));await sleep(1500);rec.stop();}catch(e){out.textContent=String(e);button.disabled=false;}};
</script></body></html>
