<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ribbon and card polish QA</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#09182c}nav{display:flex;gap:7px;padding:8px;flex-wrap:wrap}nav button{padding:7px}#host{position:relative;width:1280px;height:780px;margin:auto;overflow:hidden}output{display:block;font:12px monospace;white-space:pre-wrap;color:#b9f5dd;padding:8px}</style></head><body><nav><button id="desktop">Desktop</button><button id="phone">Phone</button><button id="landscape">Landscape</button><button id="tray">Tray</button><button id="land">Land next</button><button id="collection">Collection</button><button id="history">History</button><button id="fan">History fan</button><button id="results">Results</button><button id="reduced">Reduced motion</button><button id="close">Close</button></nav><div class="canvas-host" id="host"></div><output id="report">Loading…</output><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {newSave,settleOpening} from '/src/game/model.ts';import {isSpecialCard} from '/src/game/specialCard.ts';import {setSound} from '/src/game/audio.ts';import {cardTrayLayout} from '/src/game/rendering.ts';
const host=document.querySelector('#host'),out=document.querySelector('#report');let save=newSave();const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>(save=newSave())});await game.init();setSound(false);
const special=game.pool.filter(isSpecialCard).slice(0,4),normal=game.pool.filter(c=>!isSpecialCard(c)).slice(0,7),cards=[special[0],normal[0],special[1],normal[1],normal[2],special[2],normal[3],special[3],...normal.slice(4)];const opening={id:'frame-qa',at:new Date().toISOString(),cards,pack:game.selected};save=settleOpening({...save,active:opening});const result=save.history[0];game.save=save;game.render();
function clear(){game.panel=null;game.inspected=null;game.resultId=undefined;game.phase='browse';game.stage.clearCard?.();game.save=save;game.view.historyOpening=null;}
function tray(){clear();game.save={...save,active:opening};game.phase='awaiting';game.index=4;game.render();for(let i=0;i<4;i++)game.stage.onCardStored?.(i);game.stage.scene.setBoard({phase:'revealed',packName:game.selected.name,index:3,cardName:cards[3].name,cardValue:cards[3].value});}
for(const [id,w,h] of [['desktop',1280,780],['phone',390,780],['landscape',568,320]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};
document.querySelector('#tray').onclick=tray;document.querySelector('#land').onclick=()=>{let i=0;while(game.view.landed.has(i))i++;if(i<11)game.stage.onCardStored?.(i);};
for(const panel of ['collection','history'])document.querySelector('#'+panel).onclick=()=>{clear();game.panel=panel;game.render();};
document.querySelector('#fan').onclick=()=>{clear();game.panel='history';game.render();game.view.openHistoryHand(result,0);};document.querySelector('#results').onclick=()=>{clear();game.resultId=result.id;game.phase='complete';game.stage.showResult();game.render();};document.querySelector('#reduced').onclick=()=>{game.reduced=!game.reduced;game.render();};document.querySelector('#close').onclick=()=>game.view.dismissModal();
let previous=0,moves=false;setInterval(()=>{const frames=[...game.view.specialFrames],track=frames[0]?.rig.state.getCurrent(0)?.trackTime??0;if(track&&track!==previous)moves=true;previous=track;const layout=cardTrayLayout(host.clientWidth,host.clientHeight,game.index);out.textContent=JSON.stringify({phase:game.phase,panel:game.panel,size:[host.clientWidth,host.clientHeight],frames:frames.length,spineTime:+track.toFixed(2),animated:moves,reduced:game.reduced,stageTicker:game.stage.app.ticker.started,prices:[...game.view.trayPrices].map(([i,p])=>({i,visible:p.visible,bottom:+p.getBounds().maxY.toFixed(1),value:cards[i].value})),landed:[...game.view.landed],trayBottom:layout.y+layout.slotHeight,modal:game.view.modalKind,transitioning:game.view.transitioning},null,2);},200);tray();
</script></body></html>
