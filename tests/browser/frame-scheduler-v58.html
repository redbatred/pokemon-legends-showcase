<!doctype html><meta charset="utf-8"><title>Browser frame scheduler check</title><style>body{background:#142535;color:#fff;font:20px system-ui}button{padding:20px}canvas{display:block}</style><button>Measure browser frames</button><canvas width="540" height="720"></canvas><pre>Ready · no game, no audio, no WebGL</pre><script>
const button=document.querySelector('button'),canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),out=document.querySelector('pre');button.onclick=()=>{button.disabled=true;let start=0,last=0,a=[];function frame(t){if(!start)start=t;if(last)a.push(t-last);last=t;c.clearRect(0,0,540,720);c.fillStyle='#75e9da';c.fillRect(270+Math.sin(t*.002)*190,300,40,40);if(t-start<10000)requestAnimationFrame(frame);else{a.sort((x,y)=>x-y);out.textContent=JSON.stringify({frames:a.length,p95:a[Math.floor(a.length*.95)],max:a.at(-1),hidden:document.hidden});}}requestAnimationFrame(frame);};
</script>
