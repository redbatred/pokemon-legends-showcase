<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special reveal sequence QA</title><link rel="stylesheet" href="/src/styles.css"><style>body,html{overflow:auto;background:#071528;color:white}nav{display:flex;gap:12px;align-items:center;padding:10px}button{padding:8px}#host{position:relative;width:1280px;height:780px;margin:auto}output{font:12px monospace;max-width:700px}</style></head><body><nav><button id="start" disabled>Start fixture</button><button id="next">Next / finish reveal</button><button id="turbo">Toggle turbo</button><button id="phone">Phone</button><button id="desktop">Desktop</button><button id="freeze">Freeze</button><output>Loading…</output></nav><div id="host" class="canvas-host"></div><script type="module">
import {PokemonGame} from '/src/game/Game.ts';import {priceCard,newSave,energy,DEFAULT_PACK} from '/src/game/model.ts';import {setSound} from '/src/game/audio.ts';
const host=document.querySelector('#host'),out=document.querySelector('output');
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const ids=['swsh8-43','swsh12.5gg-GG38','sv03-066','swsh8-157','sm115-44','swsh11-058','sv03-026','sv03-223','swsh11tg-TG17','sv04.5-232'];
let save={...newSave(),balance:100000,active:{id:'special-reveals-test',at:new Date().toISOString(),cards:[...ids.map(id=>priceCard(raw.find(c=>c.id===id))),energy],pack:DEFAULT_PACK}};
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});
game.sound=false;game.reduced=false;game.turbo=false;
game.settings=()=>{setSound(game.sound);game.stage.updateOptions({reduced:game.reduced,turbo:game.turbo,low:game.low,onTear:()=>game.action('tear'),onNext:()=>game.action('next')});};game.settings();await game.init();
document.querySelector('#start').disabled=false;document.querySelector('#start').onclick=()=>game.action('tear');document.querySelector('#next').onclick=()=>game.action('next');document.querySelector('#turbo').onclick=()=>game.action('turbo');
for(const [id,w,h] of [['phone',390,780],['desktop',1280,780]])document.querySelector('#'+id).onclick=()=>{host.style.width=w+'px';host.style.height=h+'px';};let frozen=false;document.querySelector('#freeze').onclick=()=>{frozen=!frozen;game.stage.setBlocked(frozen);};
setInterval(()=>{const card=save.active?.cards[game.index],sp=game.stage.special,model=sp?.hero.model;out.textContent=JSON.stringify({phase:game.phase,index:game.index,card:card?.name,value:card?.value,packPrice:game.selected.price,preview:!!save.active?.previewSpecial,turbo:game.turbo,pokemon:!!sp?.hero.visible,model:!!model,win:game.view?.rewards?.flights?.find(f=>f.index===game.index)?.label.state.value,error:game.error});},200);
</script></body></html>
