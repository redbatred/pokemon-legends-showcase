<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto;background:#121725}nav{padding:12px;display:flex;gap:10px;color:white;font:14px Arial}button,select,input{padding:8px}#host{width:540px;height:720px;position:relative;margin:auto}#host>canvas{width:100%;height:100%;display:block}output{display:block;color:white;text-align:center;font:14px Arial;padding:10px}</style></head><body><nav><select id="species"><option value="charizard">Charizard · BIG</option><option value="blastoise">Blastoise · MEGA</option><option value="pikachu">Pikachu · EPIC</option><option value="mewtwo">Mewtwo · LEGENDARY</option></select><button id="play" disabled>Play sequence</button><label>Time <input id="time" type="range" min="1.73" max="8.5" step=".01" value="7.5"></label><button data-age="5.7">Wind-up</button><button data-age="6.18">Contact</button><button data-age="6.5">Clear</button><button data-age="7.5">Hold</button><button id="export">Export animation frames</button><a id="frames" hidden>Download frames</a></nav><div id="host"></div><output>Loading muted preview…</output><script type="module">
import {zipSync} from '/node_modules/three/examples/jsm/libs/fflate.module.js';import {Application,BitmapFont} from 'pixi.js';import {WinCinema,preloadWinCinema} from '/src/game/WinCinema.ts';import {MoneyReadout} from '/src/game/MoneyReadout.ts';import {winCinemaPose,winCinemaGeometry} from '/src/game/winCinemaMotion.ts';import {winAmountBody} from '/src/game/winContinuity.ts';import {setAudioMonitorMuted,setSound} from '/src/game/audio.ts';
setAudioMonitorMuted(true);setSound(false);const font=await new FontFace('Nunito','url(/assets/fonts/Nunito.ttf)').load();document.fonts.add(font);BitmapFont.install({name:'LegendsMoney',style:{fontFamily:'Nunito',fontSize:64,fontWeight:'900',fill:0xffffff},chars:'0123456789$.,+- ',resolution:2});
const app=new Application();await app.init({width:540,height:720,resolution:2,antialias:true,backgroundAlpha:0});document.querySelector('#host').append(app.canvas);const input=document.querySelector('#time'),out=document.querySelector('output'),button=document.querySelector('#play');let cinema,label,labelWidth=1,age=7.5,playing=false,tier='big',value=2000;
const options={charizard:['big',2000],blastoise:['mega',8000],pikachu:['epic',20000],mewtwo:['legendary',50000]};
async function load(){button.disabled=true;playing=false;cinema?.destroy();label?.destroy();const species=document.querySelector('#species').value;[tier,value]=options[species];await preloadWinCinema(species);cinema=new WinCinema(tier,species,false,()=>{},'/assets/pokemon/'+species+'.png');app.stage.addChild(cinema.root);label=new MoneyReadout({identity:species,value:0,target:value,remaining:0},{size:32,cinematic:true,color:0xffffff,align:'center',width:600,plus:false,centerY:true,hero:false,reduced:true,ticks:false,draw:()=>{}});app.stage.addChild(label);labelWidth=label.getLocalBounds().width;while(!cinema.ready)await new Promise(r=>setTimeout(r,20));age=7.5;button.disabled=false;draw();}
function draw(){if(!cinema?.ready)return;cinema.update(age,540,720);const g=winCinemaGeometry(540,720,tier==='legendary',age),p=winCinemaPose(age,0,tier),b=winAmountBody(age);label.display(value*p.count);label.cinema(age);label.position.set(g.x,g.amountY+b.lift*720);label.scale.set(Math.min(g.size/32,g.amountWidth/labelWidth)*b.x,Math.min(g.size/32,g.amountWidth/labelWidth)*b.y);label.alpha=p.amountAlpha;input.value=age;out.textContent='Locally muted · '+tier.toUpperCase()+' · '+age.toFixed(2)+' seconds';}
document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{playing=false;age=Number(b.dataset.age);draw();});input.oninput=()=>{playing=false;age=Number(input.value);draw();};button.onclick=()=>{age=1.73;playing=true;};document.querySelector('#species').onchange=load;app.ticker.add(t=>{if(playing){age=Math.min(8.5,age+t.deltaMS/1000);if(age===8.5)playing=false;draw();}});await load();
document.querySelector('#export').onclick=async()=>{const exportButton=document.querySelector('#export');exportButton.disabled=true;playing=false;app.stop();const files={};for(let t=1.73;t<3;t+=1/60){age=t;draw();}for(let i=0;i<330;i++){age=3+i/60;draw();app.render();const blob=await new Promise(r=>app.canvas.toBlob(r,'image/jpeg',.96));files['frame'+String(i).padStart(4,'0')+'.jpg']=new Uint8Array(await blob.arrayBuffer());out.textContent='Rendering animation preview · '+(i+1)+' / 330 · locally muted';}const link=document.querySelector('#frames');link.href=URL.createObjectURL(new Blob([zipSync(files,{level:0})],{type:'application/zip'}));link.download='win-v57-'+document.querySelector('#species').value+'-frames.zip';link.hidden=false;out.textContent='Animation frames ready · locally muted · export is not a live FPS measurement';exportButton.disabled=false;app.start();};
</script></body></html>
