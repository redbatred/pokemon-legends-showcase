<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elemental Spine card frames</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{background:#0c1d32;overflow:auto;color:#e7f9ff}nav{padding:12px;display:flex;gap:10px;flex-wrap:wrap}button{padding:9px}#host{width:1100px;margin:auto}output{display:block;white-space:pre-wrap;font:12px monospace;padding:10px}</style></head><body><nav><button id="basic">Double rare</button><button id="ultra">Ultra rare</button><button id="epic">Special illustration rare</button><button id="small">Small cards</button><button id="checks">Check artwork and price protection</button></nav><div id="host"></div><output id="report">Loading</output><script type="module">
import {Application,Assets,Container,Sprite,Text,Rectangle} from 'pixi.js';
import {SpecialCardFrame} from '/src/game/SpecialCardFrame.ts';
import {cardPowerKind} from '/src/game/powerProfiles.ts';import {isSpecialCard} from '/src/game/specialCard.ts';
const app=new Application();await app.init({width:1100,height:1020,background:'#0c1d32',antialias:true,resolution:2,autoDensity:true,preference:'webgl'});document.querySelector('#host').append(app.canvas);
const packs=await fetch('/assets/packs.json').then(r=>r.json()),catalogs=await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json()))),cards=catalogs.flat();
const kinds=['fire','water','electric','leaf','ice','dark','psychic','fairy','dragon','metal','ground','wind'];let rarity='Special illustration rare',small=false,frames=[];
const chosen=kinds.map(kind=>cards.find(c=>isSpecialCard(c)&&cardPowerKind(c)===kind));await Assets.load(chosen.map(c=>c.image));
function build(){frames=[];app.stage.removeChildren().forEach(c=>c.destroy({children:true}));kinds.forEach((kind,i)=>{const card=chosen[i],w=small?80:170,h=w*435/312,group=new Container();group.position.set(137+(i%4)*275,54+Math.floor(i/4)*330);app.stage.addChild(group);const text=new Text({text:kind.toUpperCase()+' · '+card.name,style:{fontFamily:'Nunito',fontSize:13,fill:0xeafaff,fontWeight:'800'}});text.anchor.set(.5);group.addChild(text);const art=new Sprite(Assets.get(card.image));art.anchor.set(.5);art.position.y=145;art.width=w;art.height=h;group.addChild(art);const frame=new SpecialCardFrame(w,h,kind,rarity);frame.y=145;group.addChild(frame);frames.push(frame);const price=new Text({text:'$125.00',style:{fontFamily:'Nunito',fontSize:18,fill:0xeafaff,fontWeight:'800'}});price.anchor.set(.5,0);price.y=145+h/2+7;group.addChild(price);});document.querySelector('#report').textContent=rarity+' · '+frames.length+' native Spine frames';}
app.ticker.add(t=>frames.forEach(f=>f.update(t.deltaMS/1000)));
for(const [id,value] of [['basic','Double rare'],['ultra','Ultra Rare'],['epic','Special illustration rare']])document.querySelector('#'+id).onclick=()=>{rarity=value;build();};document.querySelector('#small').onclick=()=>{small=!small;build();};
document.querySelector('#checks').onclick=async()=>{const results=[];for(const kind of kinds)for(const w of [80,126,170]){const h=w*435/312,fx=new SpecialCardFrame(w,h,kind,rarity);fx.update(.7);const left=-w/2-20,top=-h/2-20;const pixels=app.renderer.extract.pixels({target:fx,frame:new Rectangle(left,top,w+40,h+60),resolution:1,antialias:false});fx.update(.83);const after=app.renderer.extract.pixels({target:fx,frame:new Rectangle(left,top,w+40,h+60),resolution:1,antialias:false});let art=0,price=0,rim=0,changed=0;for(let y=0;y<pixels.height;y++)for(let x=0;x<pixels.width;x++){const k=(y*pixels.width+x)*4,a=pixels.pixels[k+3];if(Math.abs(a-after.pixels[k+3])+Math.abs(pixels.pixels[k]-after.pixels[k])+Math.abs(pixels.pixels[k+1]-after.pixels[k+1])+Math.abs(pixels.pixels[k+2]-after.pixels[k+2])>40)changed++;if(a<5)continue;const xx=left+x,yy=top+y;if(Math.abs(xx)<w/2-4&&Math.abs(yy)<h/2-4)art++;if(yy>h/2+4)price++;rim++;}results.push({kind,width:w,artPixels:art,pricePixels:price,visiblePixels:rim,animatedPixels:changed,pass:art===0&&price===0&&rim>200&&changed>50});fx.destroy();await new Promise(requestAnimationFrame);}document.querySelector('#report').textContent=JSON.stringify({pass:results.every(r=>r.pass),results},null,2);};build();
</script></body></html>
