<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special win demo</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{margin:0;height:100%;background:#0d1b2a;color:#edf6ff;overflow:hidden;font:13px system-ui}nav{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;box-sizing:border-box;background:#0a1522;white-space:nowrap;overflow-x:auto}nav a{color:#17354b;background:#fff1d1;border-radius:4px;padding:4px 9px;font-weight:700;text-decoration:none}nav a.on{background:#ffcf5a}#host{position:relative;width:100vw;height:calc(100vh - 34px)}</style></head><body><nav><span>Next pack:</span><a data-set="ladder">All tiers</a><a data-set="special">Special pull</a><a data-set="big">BIG</a><a data-set="mega">MEGA</a><a data-set="epic">EPIC</a><a data-set="legendary">LEGENDARY</a><a data-set="bonus">Bonus: catch</a><a data-set="escape">Bonus: escape</a><span id="note"></span></nav><div id="host" class="canvas-host"></div><script type="module">
// The actual game with a fixed demo pack, so every special win tier can be played by hand with sound.
// Fixture values are presentation mocks on demo credits; nothing here ships in the live game.
import {PokemonGame} from '/src/game/Game.ts';import {newSave,priceCard,energy,DEFAULT_PACK} from '/src/game/model.ts';
const packs=await(await fetch('/assets/packs.json')).json(),raw=(await Promise.all(packs.map(p=>fetch(p.catalogUrl).then(r=>r.json())))).flat();
const ids={charizard:'sv03-215',blastoise:'sv03.5-200',pikachu:'swsh11tg-TG17',mewtwo:'swsh12.5gg-GG44'};
const sets={ladder:'charizard:2000,blastoise:8000,pikachu:20000,mewtwo:50000',special:'charizard:1200,blastoise:500,pikachu:1500',big:'charizard:2000,blastoise:3500',mega:'blastoise:8000,charizard:12000',epic:'pikachu:20000,charizard:30000',legendary:'mewtwo:50000,charizard:60000',bonus:'sv03-026:90,sv03-030:600,sv03-045:50',escape:'sv03-026:90,sv03-030:600,sv03-045:50'};
// The two bonus sets put a bonus Poké Ball on each of the three cards and fix the capture outcome through the game's own `outcome` parameter.
const bonusOutcome={bonus:'capture',escape:'escape'};
const query=new URLSearchParams(location.search),set=sets[query.get('set')]?query.get('set'):'ladder',order=(query.get('cards')??sets[set]).split(',').map(entry=>{const [name,value]=entry.split(':');return {...priceCard(raw.find(c=>c.id===(ids[name]??name))),value:Number(value)};});
for(const link of document.querySelectorAll('nav a')){link.href='?set='+link.dataset.set+(bonusOutcome[link.dataset.set]?'&outcome='+bonusOutcome[link.dataset.set]:'');link.classList.toggle('on',link.dataset.set===set&&!query.get('cards'));}
document.querySelector('#note').textContent='Cut the pack, then tap for the next card. Pick a set to deal a new demo pack. Bonus sets: reveal all three cards, finish the pack, then throw.';
let save={...newSave(),balance:100000,active:{id:'win-demo-'+Date.now(),at:new Date().toISOString(),cards:[...order.flatMap(card=>[card,energy]),...Array(11).fill(energy)].slice(0,11),showdownSymbols:bonusOutcome[set]&&!query.get('cards')?[0,2,4]:[],pack:DEFAULT_PACK}};
const game=new PokemonGame(document.querySelector('#host'),{loadSave:async()=>save,transactSave:async update=>(save=update(save)),resetSave:async()=>save});await game.init();window.demo={game};
</script></body></html>
