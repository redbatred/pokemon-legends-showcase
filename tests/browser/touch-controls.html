<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack grid touch regression</title><link rel="stylesheet" href="/src/styles.css"><style>html,body{overflow:auto}nav{display:flex;gap:12px;padding:12px;align-items:center}#host{position:relative;width:390px;height:780px;margin:auto;overflow:hidden}output{font:14px monospace;white-space:pre-wrap}</style></head><body><nav><button id="test">Run grid regression</button><button id="desktop">Desktop</button><button id="phone">Phone</button><output>Loading</output></nav><div class="canvas-host" id="host"></div><script type="module">
import {PokemonGame} from '/src/game/Game.ts';
import {newSave} from '/src/game/model.ts';
const host=document.querySelector('#host'),out=document.querySelector('output');let save=newSave();
const game=new PokemonGame(host,{loadSave:async()=>save,transactSave:async fn=>(save=fn(save)),resetSave:async()=>(save=newSave())});await game.init();
document.querySelector('#desktop').onclick=()=>{host.style.width='1280px';host.style.height='720px'};
document.querySelector('#phone').onclick=()=>{host.style.width='390px';host.style.height='780px'};
document.querySelector('#test').onclick=async()=>{
 const results=[],hits=[...host.querySelectorAll('[data-control^="pack-"]')],frame=host.getBoundingClientRect();
 results.push((hits.length===game.packs.length?'PASS':'FAIL')+' every pack has a native tap/keyboard target');
 results.push((hits.every(hit=>{const r=hit.getBoundingClientRect();return r.left>=frame.left&&r.right<=frame.right+1&&r.bottom<=frame.bottom+1})?'PASS':'FAIL')+' every pack fits without a carousel');
 const button=host.querySelector('[data-control="pack-'+game.packs[1].id+'"]');button.click();
 results.push((game.selectedId===game.packs[1].id&&game.phase==='browse'&&!save.active?'PASS':'FAIL')+' selecting only previews the chosen pack');
 const css=getComputedStyle(host.querySelector('[data-control^="pack-"]'));
 results.push((css.webkitTapHighlightColor==='rgba(0, 0, 0, 0)'&&css.backgroundColor==='rgba(0, 0, 0, 0)'?'PASS':'FAIL')+' no native tap background');
 out.textContent=results.join('\n');
};out.textContent='Ready · in-memory save · native buttons, no gesture interception';
</script></body></html>
