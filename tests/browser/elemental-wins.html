<!doctype html><html><head><meta charset="utf-8"><title>Elemental Spine QA</title><style>body{background:#071528;color:#ecfaff;font:14px sans-serif;margin:0}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px 12px}canvas{display:block;margin:0 auto}</style></head><body><nav id="types"></nav><nav><button id="replay">Replay entrance</button><button id="hold">Hold flow</button><button id="pause">Freeze</button><button id="phone">Phone</button><button id="desktop">Desktop</button><output id="state"></output></nav><script type="module">
import {Application,Container,Graphics,Text,Assets,Sprite} from 'pixi.js';import {ElementalWin,preloadElementalWin} from '/src/game/ElementalWin.ts';import {ELEMENTAL_KINDS} from '/src/game/elementalWinRigData.ts';import {gameLayout} from '/src/game/rendering.ts';
await preloadElementalWin();const app=new Application();await app.init({width:1000,height:700,resolution:devicePixelRatio,autoDensity:true,background:0x071528});document.body.append(app.canvas);const back=await Assets.load('/assets/card-back.webp');let effect=null,age=0,playing=true,kind='fire',w=1000,h=700;
function start(){effect?.destroy();app.stage.removeChildren().forEach(c=>c.destroy({children:true}));app.renderer.resize(w,h);age=0;const l=gameLayout(w,h,true),ground=new Graphics().ellipse(w/2,l.stageY,l.stageWidth/2,l.stageWidth*.205).fill(0x1b3a5c).stroke({color:0x65a9bd,width:2});app.stage.addChild(ground);effect=new ElementalWin(kind,true);app.stage.addChild(effect.back);const card=new Sprite(back);card.anchor.set(.5);card.width=312*l.scale;card.height=435*l.scale;card.position.set(w/2,l.worldY);app.stage.addChild(card,effect.front);}
for(const name of ELEMENTAL_KINDS){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{kind=name;playing=true;start();};document.querySelector('#types').append(b);}start();app.ticker.add(t=>{if(playing)age+=t.deltaMS/1000;effect.update(age,w,h);document.querySelector('#state').textContent=kind+' · '+age.toFixed(2)+'s';});document.querySelector('#replay').onclick=()=>{playing=true;start();};document.querySelector('#hold').onclick=()=>{age=4;effect.finish();playing=true;};document.querySelector('#pause').onclick=()=>playing=!playing;document.querySelector('#phone').onclick=()=>{w=390;h=780;start();};document.querySelector('#desktop').onclick=()=>{w=1000;h=700;start();};
</script></body></html>
